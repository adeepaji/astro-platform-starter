name: Verify public BF GYM website
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  public-site-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test published Netlify pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://bfgym.netlify.app"
          urls=("/" "/kerala-uk/" "/ml/kerala-uk/" "/start/" "/trainer/" "/programmes/" "/sample-plan/" "/app/" "/app/dashboard/" "/app/membership/" "/app/member-card/" "/app/workouts/" "/privacy/" "/manifest.webmanifest" "/images/members/demo-member.svg" "/sitemap.xml")
          expected=("BF GYM" "MALAYALI FOUNDED" "കേരളത്തിൽ നിന്ന്" "MAKE FITNESS" "Adeep Aji" "TRAINING PLAN" "YOUR PLAN" "BF GYM" "MY PROGRAMME" "CONCEPT PREVIEW" "ONE CARD" "VIDEO LIBRARY" "Digital membership card and dashboard demonstration" "BF GYM" "data:image/jpeg;base64" "ml/kerala-uk/")
          for i in "${!urls[@]}"; do
            path="${urls[$i]}"
            needle="${expected[$i]}"
            echo "::group::Checking ${base}${path}"
            success=0
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --location --silent --show-error --max-time 18 --output /tmp/bfgym-page --write-out "%{http_code}" "${base}${path}" || echo 000)"
              if [ "$code" = "200" ] && grep -Fqi "$needle" /tmp/bfgym-page; then
                echo "PASS ${path}: HTTP 200 and expected page content found"
                success=1
                break
              fi
              echo "Attempt ${attempt}/6: ${path} yielded HTTP ${code}; expected: ${needle}"
              if [ "$attempt" -lt 6 ]; then sleep 15; fi
            done
            echo "::endgroup::"
            if [ "$success" -ne 1 ]; then
              echo "::error::Netlify URL ${base}${path} failed the live check. Confirm Netlify build settings, published deploy, and the main branch."
              exit 1
            fi
          done
          echo "All sixteen public BF GYM paths passed."
          photo_status="$(curl --location --silent --show-error --max-time 18 --output /tmp/bfgym-trainer-portrait --write-out "%{http_code}" "$base/images/trainer/adeep-portrait.jpg" || echo 000)"
          photo_type="$(file --brief --mime-type /tmp/bfgym-trainer-portrait 2>/dev/null || echo unknown)"
          if [ "$photo_status" != "200" ] || [ "$photo_type" != "image/jpeg" ] || [ "$(wc -c </tmp/bfgym-trainer-portrait)" -lt 1000 ]; then
            echo "::error::Trainer photo did not serve as a valid JPEG: HTTP $photo_status, type $photo_type"
            exit 1
          fi
          echo "Trainer portrait JPEG is accessible on Netlify."
          new_photo_ok=0
          for attempt in 1 2 3 4 5 6; do
            new_status="$(curl --location --silent --show-error --max-time 18 --output /tmp/bfgym-new-portrait --write-out "%{http_code}" "$base/images/trainer/adeep-portrait-new.webp" || echo 000)"
            new_type="$(file --brief --mime-type /tmp/bfgym-new-portrait 2>/dev/null || echo unknown)"
            if [ "$new_status" = "200" ] && [ "$new_type" = "image/webp" ] && [ "$(wc -c </tmp/bfgym-new-portrait)" -ge 6000 ]; then
              if curl --location --silent --show-error --max-time 18 "$base/trainer/" | grep -Fq '/images/trainer/adeep-portrait-new.webp'; then
                new_photo_ok=1
                break
              fi
            fi
            echo "Attempt $attempt/6: new portrait or trainer page not updated yet (HTTP $new_status / $new_type)"
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          if [ "$new_photo_ok" -ne 1 ]; then
            echo "::error::New uploaded trainer portrait is not served or linked on the live trainer profile"
            exit 1
          fi
          echo "New trainer portrait WEBP and trainer page reference are live."
          # Confirm the five-pose image asset is actually published, not just the trainer HTML.
          pose_ok=0
          for attempt in 1 2 3 4 5 6; do
            pose_status="$(curl --location --silent --show-error --max-time 18 --output /tmp/bfgym-poses --write-out "%{http_code}" "$base/images/trainer/adeep-poses-strip.webp" || echo 000)"
            pose_type="$(file --brief --mime-type /tmp/bfgym-poses 2>/dev/null || echo unknown)"
            if [ "$pose_status" = "200" ] && [ "$pose_type" = "image/webp" ] && [ "$(wc -c </tmp/bfgym-poses)" -gt 2000 ]; then
              pose_ok=1
              break
            fi
            echo "Attempt $attempt/6: pose image is not ready: HTTP $pose_status, type $pose_type"
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          if [ "$pose_ok" -ne 1 ]; then
            echo "::error::Trainer five-pose image strip is not yet accessible on the live website"
            exit 1
          fi
          echo "Trainer pose strip WEBP is accessible on Netlify."

          # The demo portrait must exist as a real WebP; don't allow a missing-image mockup.
          demo_photo_ok=0
          for attempt in 1 2 3 4 5 6; do
            demo_status="$(curl --location --silent --show-error --max-time 18 --output /tmp/bfgym-member-photo --write-out "%{http_code}" "$base/images/membership/demo-member.webp" || echo 000)"
            demo_type="$(file --brief --mime-type /tmp/bfgym-member-photo 2>/dev/null || echo unknown)"
            if [ "$demo_status" = "200" ] && [ "$demo_type" = "image/webp" ] && [ "$(wc -c </tmp/bfgym-member-photo)" -gt 2500 ]; then
              demo_photo_ok=1
              break
            fi
            echo "Attempt $attempt/6: sample member photo pending: HTTP $demo_status; type $demo_type"
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          if [ "$demo_photo_ok" -ne 1 ]; then
            echo "::error::Fictional demo member image is not available on the live website"
            exit 1
          fi
          echo "Demo member WebP image is live."
          member_html="$(curl --location --silent --show-error --max-time 18 "$base/app/membership/")"
          if ! grep -Fq 'BF-DEMO-0001' <<< "$member_html"; then
            echo "::error::Demo member ID is missing"
            exit 1
          fi
          if ! grep -Fq 'NOT SCANNABLE' <<< "$member_html"; then
            echo "::error::Non-scannable QR placeholder disclosure is missing"
            exit 1
          fi
          if grep -Eqi '<(input|form)([[:space:]>])' <<< "$member_html"; then
            echo "::error::Demo membership page must not collect user data through a form/input"
            exit 1
          fi
          echo "Demo member identity and no-form guard passed."


          # Instagram only accepts JPEG/PNG; confirm the dedicated photo endpoint.
          instagram_ready=0
          for attempt in 1 2 3 4 5 6; do
            ig_status="$(curl --location --silent --show-error --max-time 18 --output /tmp/bfgym-instagram-photo --write-out "%{http_code}" "$base/images/trainer/adeep-instagram.jpg" || echo 000)"
            ig_type="$(file --brief --mime-type /tmp/bfgym-instagram-photo 2>/dev/null || echo unknown)"
            if [ "$ig_status" = "200" ] && [ "$ig_type" = "image/jpeg" ] && [ "$(wc -c </tmp/bfgym-instagram-photo)" -gt 8000 ]; then
              instagram_ready=1
              break
            fi
            echo "Attempt $attempt/6: dedicated Instagram image pending (HTTP $ig_status, $ig_type)"
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          if [ "$instagram_ready" -ne 1 ]; then
            echo "::error::Instagram-compatible JPEG is not published yet"
            exit 1
          fi
          echo "Instagram-compatible JPEG is live on Netlify."


          # Ensure both localized founder pages link to each other so search engines
          # and visitors can select the right language.
          english_founder="$(curl --location --silent --show-error --max-time 18 "$base/kerala-uk/")"
          malayalam_founder="$(curl --location --silent --show-error --max-time 18 "$base/ml/kerala-uk/")"
          if ! grep -Fq 'hreflang="ml"' <<< "$english_founder"; then
            echo "::error::English founder page is missing Malayalam alternate"
            exit 1
          fi
          if ! grep -Fq 'hreflang="en-GB"' <<< "$malayalam_founder"; then
            echo "::error::Malayalam founder page is missing English alternate"
            exit 1
          fi
          if ! grep -Fq '<html lang="ml">' <<< "$malayalam_founder"; then
            echo "::error::Malayalam page is missing the language attribute"
            exit 1
          fi
          echo "Bilingual page alternates and Malayalam language declaration verified."
